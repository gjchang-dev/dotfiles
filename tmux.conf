# 給人看：tmux 設定，只在 Mac 上用。install.sh 會 symlink 到 ~/.tmux.conf
# 注意：這裡刻意不設 default-command，practice session 的 default-command 由 ~/.zshrc 的 practice function 設定

# ========== 1. 基礎 ==========
# Prefix 改成 Ctrl+a
set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g default-terminal 'screen-256color'
set -g history-limit 50000
set -g status-fg green
set -g status-bg black

# 按 Esc 後等多久判斷是不是組合鍵；預設 500ms，在 vim 裡按 Esc 會卡一下
set -s escape-time 10

# 外層終端機（Ghostty）支援真彩色和 OSC 52 剪貼簿
set -as terminal-features ',xterm-ghostty:RGB:clipboard'

# Prefix r：重新載入這個檔
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# ========== 2. 分割與切換 ==========
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

bind -n M-Left  previous-window
bind -n M-Right next-window

# Prefix Ctrl+k：清掉 scrollback（K 讓給調整 pane 大小）
bind C-k clear-history \; display-message "Scrollback buffer cleared!"

# ========== 3. 滑鼠與複製 ==========
set -g mouse on
# Prefix m：開關滑鼠模式（要用終端機原生選取時先關掉）
bind m set -g mouse \; display-message "Mouse: #{?mouse,ON,OFF}"

setw -g mode-keys vi

# 複製的內容交給 pbcopy 寫進 Mac 剪貼簿（tmux 跑在 Mac 上，不靠終端機）
set -s copy-command 'pbcopy'
# 容器裡的程式（vim）送出的 OSC 52，tmux 收下並轉給 Ghostty
set -s set-clipboard on

bind -T copy-mode-vi v send -X begin-selection
# 複製後留在原地，不跳回最底下（沿用舊的 tmux-yank 習慣）；按 q 離開 copy mode
bind -T copy-mode-vi y send -X copy-pipe
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe

# ========== 4. Claude Code 在 tmux 裡要的設定 ==========
# 通知、進度條穿過 tmux 送到 Ghostty
set -g allow-passthrough on
# 分辨 Shift+Enter 和 Enter
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'


# ========== 5. 開 Mac 本機的 shell ==========
# practice 的新 pane 一律跑 default-command 進容器；明確指定要跑 zsh，就不會套用 default-command
# Prefix M：浮動視窗開 Mac 的 zsh，打 exit 或 Ctrl+d 關掉
bind M display-popup -E -w 80% -h 80% -d "#{pane_current_path}" "zsh -l"
# Prefix C（大寫）：開一個 Mac 的 window；小寫 c 還是開容器的
bind C new-window -c "#{pane_current_path}" "zsh -l"

# ========== 6. 用 vim 鍵切換、調整 pane ==========
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# -r：按一次 Prefix 之後，0.5 秒內可以連按 H/J/K/L，不用每次都重按 Prefix
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5